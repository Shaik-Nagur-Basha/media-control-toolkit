<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ADE80;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="128" height="128" rx="26" ry="26" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="64" x2="128" y2="64" stroke="#6366F1" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="64" y1="0" x2="64" y2="128" stroke="#6366F1" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Play button (triangle) centered slightly left-up -->
  <polygon points="38,32 38,72 74,52" fill="url(#playGrad)" filter="url(#glow)" opacity="0.95"/>

  <!-- Slider track 1 (volume) -->
  <rect x="24" y="88" width="56" height="4" rx="2" fill="#374151" opacity="0.7"/>
  <rect x="24" y="88" width="36" height="4" rx="2" fill="url(#accentGrad)"/>
  <!-- Slider knob 1 -->
  <circle cx="60" cy="90" r="7" fill="#22C55E" filter="url(#glow)"/>
  <circle cx="60" cy="90" r="3.5" fill="#fff" opacity="0.9"/>

  <!-- Slider track 2 (speed) -->
  <rect x="72" y="56" width="4" height="56" rx="2" fill="#374151" opacity="0.7"/>
  <rect x="72" y="80" width="4" height="32" rx="2" fill="url(#playGrad)"/>
  <!-- Slider knob 2 -->
  <circle cx="74" cy="80" r="7" fill="url(#playGrad)" filter="url(#glow)"/>
  <circle cx="74" cy="80" r="3.5" fill="#fff" opacity="0.9"/>

  <!-- Small sound wave arcs right of play -->
  <path d="M80,42 Q88,52 80,62" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M86,37 Q98,52 86,67" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- Dot accent top-right -->
  <circle cx="104" cy="24" r="5" fill="#22C55E" opacity="0.8"/>
  <circle cx="116" cy="32" r="3" fill="#6366F1" opacity="0.5"/>
</svg>